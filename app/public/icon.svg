<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Network Advisor">
  <!-- House style: gold field, black disc, white line art, like Cockney Player. -->
  <rect width="512" height="512" fill="#D4A85C"/>
  <circle cx="256" cy="256" r="238" fill="#0B0B0C"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#F7F4EE" stroke-width="3.5" opacity="0.9"/>

  <defs>
    <path id="arcTop" d="M 96 256 A 160 160 0 1 1 416 256" fill="none"/>
  </defs>

  <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33"
        font-weight="700" letter-spacing="3.2" fill="#F7F4EE">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">NETWORK ADVISOR</textPath>
  </text>

  <!-- LAN: a hub with three leaves, the shape of the thing itself. -->
  <g stroke="#F7F4EE" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M256 252 L256 176"/>
    <path d="M256 252 L193 306"/>
    <path d="M256 252 L319 306"/>
  </g>
  <circle cx="256" cy="252" r="15" fill="#F7F4EE"/>
  <circle cx="256" cy="176" r="12" fill="#0B0B0C" stroke="#F7F4EE" stroke-width="7"/>
  <circle cx="193" cy="306" r="12" fill="#0B0B0C" stroke="#F7F4EE" stroke-width="7"/>
  <circle cx="319" cy="306" r="12" fill="#0B0B0C" stroke="#F7F4EE" stroke-width="7"/>

  <!-- A small latency tick under the hub. -->
  <path d="M232 348 L246 336 L258 344 L270 328 L280 334" fill="none"
        stroke="#D4A85C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="256" y="392" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21"
        font-weight="500" letter-spacing="2.4" fill="#D4A85C">@CockneyTommy</text>
</svg>
