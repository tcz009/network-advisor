services:
  network-advisor:
    build: .
    image: network-advisor:${ADVISOR_TAG:-latest}
    container_name: network-advisor
    network_mode: host
    environment:
      PORT: "8090"
      DATA_DIR: /data
      BIND_HOST: 0.0.0.0
      CHECK_TARGET: "1.1.1.1"
      CHECK_HOSTNAME: "cloudflare.com"
      # Leave both unset for a purely passive hub on a trusted LAN.
      # SCAN_SUBNET turns on an ICMP sweep of your own range, e.g. 192.168.1.0/24.
      SCAN_SUBNET: "${SCAN_SUBNET:-}"
      # Intake is closed unless one of these is set. AGENT_TOKENS binds a token
      # to a sensor name, so one leak cannot rewrite the other sensors.
      # Prefer AGENT_TOKENS=MediaPi=<token>,vpngate=<token>
      AGENT_TOKEN: "${AGENT_TOKEN:-}"
      AGENT_TOKENS: "${AGENT_TOKENS:-}"
      # DNS names the dashboard may answer on. IP literals and localhost are
      # always accepted; this exists to defeat DNS rebinding.
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      # Probe TCP 9999 for TP-Link Kasa plugs during a sweep. false = ICMP only.
      KASA_PROBE: "${KASA_PROBE:-true}"
      # Notes for things the network cannot know, e.g.
      # 192.168.1.85=Blink hub for 10 cameras (3 offline)
      DEVICE_NOTES: "${DEVICE_NOTES:-}"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - network-advisor-data:/data
    restart: unless-stopped
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # The image is built locally, so there is nothing for Watchtower to pull.
      com.centurylinklabs.watchtower.enable: "false"

  # LLDP capture runs here, not in the hub: tcpdump needs NET_RAW, and the hub
  # deliberately runs unprivileged with no-new-privileges. This sidecar writes a
  # pcap into the shared volume; the hub only parses the file.
  lldp:
    image: network-advisor:${ADVISOR_TAG:-latest}
    container_name: network-advisor-lldp
    network_mode: host
    user: "0:0"
    environment:
      IFACE: "${LLDP_IFACE:-eno1}"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    volumes:
      - network-advisor-data:/data
    restart: unless-stopped
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    command:
      - sh
      - -c
      - |
        while true; do
          tcpdump -i "$$IFACE" -w /data/lldp.pcap.tmp -s 1500 -G 45 -W 1 'ether proto 0x88cc' >/dev/null 2>&1 || true
          mv /data/lldp.pcap.tmp /data/lldp.pcap 2>/dev/null || true
          sleep 5
        done

volumes:
  network-advisor-data:
    # Explicit name: the volume must not depend on which Compose project the
    # stack happened to be started with, or a `-p` change silently starts empty.
    name: network-advisor-data
