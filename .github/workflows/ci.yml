name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app/server.js
          node --check app/oui.js
          node --check app/public/app.js
      - name: Unit and HTTP tests
        working-directory: app
        run: npm test
      - name: Build the image
        run: docker build -t network-advisor:ci app
